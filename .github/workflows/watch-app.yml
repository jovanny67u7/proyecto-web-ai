name: App del reloj (APK debug)

on:
  push:
    branches: [feature/reloj-notificaciones, main]
    paths: ['watch-app/**', 'server/**', '.github/workflows/watch-app.yml']
  pull_request:
    paths: ['watch-app/**']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watch-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # La URL y el token NO están en el repo: vienen de los secrets del
      # repositorio (Settings -> Secrets and variables -> Actions).
      # Si faltan, el APK compila igual pero mostrará "SIN CONFIGURAR".
      - name: Compilar APK prod y local (debug)
        env:
          RELOJ_WS_URL: ${{ secrets.RELOJ_WS_URL }}
          RELOJ_DEVICE_TOKEN: ${{ secrets.RELOJ_DEVICE_TOKEN }}
        run: ./gradlew :app:assembleProdDebug :app:assembleLocalDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: reloj-leads-debug-apk
          path: watch-app/app/build/outputs/apk/**/debug/*.apk
          retention-days: 14

  servidor:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: asidesimple_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    # prisma.config.ts exige DATABASE_URL en todos los comandos de Prisma.
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/asidesimple_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/asidesimple_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx prisma db push --skip-generate
      - run: npx prisma generate
      - run: npm test
